name: diet_app
description: "A personalized diet and nutrition assistant app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.0
  http: ^1.3.0
  flutter_secure_storage: ^9.0.0
  intl: ^0.20.2
  fl_chart: ^0.66.0
  mesh_gradient: ^1.3.8
  google_fonts: ^6.2.1
  provider: ^6.1.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    # Aydınlatma metni / gizlilik politikası — tek kaynak (site de aynı dosyaları kullanır).
    - legal/
    # google_fonts runtime indirmesi kapalı (gizlilik): fontlar pakete gömülü.
    - assets/google_fonts/
# Launcher ikonu (yalnız Android). Kaynak: assets/icon/ — uygulama asset'i DEĞİL.
# Yeniden üretmek için: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # Ön plan görseli güvenli alana göre zaten boşluklu (logo tuvalin ~%47'si);
  # paketin varsayılan %16 ek iç boşluğu ikonu gereksiz küçültürdü.
  adaptive_icon_foreground_inset: 0
